name: caterpro
description: CaterPro manager Flutter frontend generated from Stitch UI references.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  local_auth: ^3.0.1
  path: ^1.9.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reference/
