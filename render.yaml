databases:
  - name: caterpro-postgres
    databaseName: caterpro
    user: caterpro
    plan: free

services:
  - type: web
    name: caterpro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: caterpro-postgres
          property: connectionString
      - key: PG_STATE_ID
        value: default
      - key: ALLOW_DB_JSON_STORAGE
        value: false
