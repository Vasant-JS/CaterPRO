<body class="min-h-screen flex flex-col items-center justify-center p-gutter">

</div>
<main class="relative z-10 w-full max-w-[440px]">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-8">
<div class="w-24 h-24 mb-6 relative group">
<!-- Large CaterPro Logo -->

<h1 class="font-display-lg text-display-lg text-on-surface mb-1">CaterPro</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Admin Management Console</p>
</div>
<!-- Login Panel -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 login-card">
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline/50" id="email" name="email" placeholder="admin@caterpro.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all underline-offset-4" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/30 cursor-pointer" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-primary py-3.5 rounded-lg font-title-lg text-title-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>

<!-- SSO / Alternative Options (Subtle) -->

<!-- Client-side Interaction Script -->
<script>
        // Toggle password visibility interaction
        const passInput = document.getElementById('password');
        const toggleBtn = passInput.nextElementSibling;
        
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('.material-symbols-outlined').textContent = isPass ? 'visibility_off' : 'visibility';
        });

        // Simple focus animation for the card
        const card = document.querySelector('.login-card');
        const inputs = document.querySelectorAll('input');

        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                card.style.transform = 'translateY(-2px)';
                card.style.boxShadow = '0px 8px 16px rgba(31, 42, 36, 0.08)';
                card.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            });
            input.addEventListener('blur', () => {
                card.style.transform = 'translateY(0)';
                card.style.boxShadow = '0px 2px 4px rgba(31, 42, 36, 0.05)';
            });
        });
    </script>
